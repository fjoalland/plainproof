[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "plainproof"
version = "0.1.0"
description = "Browser tests written in plain language, run by the LLM of your choice, with every verdict proven on the page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fabien Joalland" }]
keywords = [
    "testing", "e2e", "end-to-end", "browser", "playwright", "llm", "ai", "agent",
    "natural-language", "bdd", "acceptance-testing", "qa", "anthropic", "openai", "gemini", "mistral", "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pillow>=10",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-playwright>=0.5",  # runs the Playwright tests generated from recordings
    "ruff>=0.6",
]

[project.scripts]
plainproof = "plainproof.cli:main"

[project.urls]
Homepage = "https://github.com/fjoalland/plainproof"
Documentation = "https://github.com/fjoalland/plainproof/tree/main/docs"
Repository = "https://github.com/fjoalland/plainproof"
Issues = "https://github.com/fjoalland/plainproof/issues"
Changelog = "https://github.com/fjoalland/plainproof/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/plainproof"]

[tool.hatch.build.targets.sdist]
include = ["src/plainproof", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

# -- tests --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:playwright"]  # pytest-playwright is only for generated tests
markers = [
    "browser: drives a real headless Chromium on local pages (no network access needed)",
]
xfail_strict = true

[tool.coverage.run]
source = ["plainproof"]
branch = true
# Playwright's sync API runs on greenlets: without this, code after a browser call is not traced.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

# -- lint and types -----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "BLE",           # every broad `except Exception` must be justified
    "UP",            # modern syntax
    "SIM",           # simplifications
    "C4",            # comprehensions
    "PIE", "RET",    # small idioms
    "PT",            # pytest style
    "N",             # naming
    "RUF",           # ruff-specific
]
ignore = [
    "E501",                        # line length is the formatter's job (long strings are kept whole)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: prompts and tests legitimately use typographic quotes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tomli"  # only imported on Python 3.10, where it is a dependency
ignore_missing_imports = true

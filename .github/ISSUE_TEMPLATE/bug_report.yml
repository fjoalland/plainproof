name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and scenario
      description: The command you ran and the scenario (remove anything confidential).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: plainproof version
      placeholder: plainproof --version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and browser
      placeholder: anthropic:claude-sonnet-5-5, chromium
  - type: textarea
    id: report
    attributes:
      label: report.json or relevant output
      description: The report.json of the run holds the plan, every action and its evidence. Screenshots show what your test account saw — share only what you may.
      render: json
